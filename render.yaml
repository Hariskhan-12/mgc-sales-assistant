services:
  - type: web
    name: mgc-sales-assistant
    runtime: python
    buildCommand: bash build.sh
    startCommand: python backend/app.py
    envVars:
      - key: LLM_API_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: LLM_MODEL
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"
